  /arena.v1.AllocationService/Allocate:
    post:
      tags:
        - arena.v1.AllocationService
      summary: Allocate
      description: |-
        Allocate claims a Ready GameServer.
         idempotency_key is required; retries with the same key return the same
         Allocation. No Ready inventory → RESOURCE_EXHAUSTED (client backs off
         and retries; the idempotency key makes retries safe).
      operationId: arena.v1.AllocationService.Allocate
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
