  /arena.v1.FleetService/ApplyFleet:
    post:
      tags:
        - arena.v1.FleetService
      summary: ApplyFleet
      description: |-
        ApplyFleet is the declarative upsert used by arenactl (DESIGN_v2 §5.4.4).
         Identified by (namespace, name); creates when absent, replaces spec when
         present. No version required — the server performs read-modify-write with
         internal retries. dry_run=true writes nothing and returns the normalized
         spec plus a diff against the current state.
      operationId: arena.v1.FleetService.ApplyFleet
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
