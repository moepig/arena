// Vendored wire-compatible subset of the Agones Beta SDK proto
// (https://github.com/googleforgames/agones proto/sdk/beta/beta.proto):
// the Counters and Lists surface, stable in Agones 1.41+ but still served
// from the beta package (DESIGN_v3 §5.1). Field numbering matches Agones so
// official client SDKs work unmodified.
syntax = "proto3";

package agones.dev.sdk.beta;

import "google/protobuf/field_mask.proto";

option go_package = "github.com/moepig/arena/gen/agones/dev/sdk/beta;beta";

// SDK service to be used in the GameServer SDK to the Pod Sidecar.
service SDK {
  // Gets a Counter. Returns NOT_FOUND if the Counter does not exist.
  rpc GetCounter(GetCounterRequest) returns (Counter);

  // UpdateCounter returns the updated Counter. Returns NOT_FOUND if the
  // Counter does not exist. Returns OUT_OF_RANGE if the Count is out of
  // range [0, Capacity].
  rpc UpdateCounter(UpdateCounterRequest) returns (Counter);

  // Gets a List. Returns NOT_FOUND if the List does not exist.
  rpc GetList(GetListRequest) returns (List);

  // UpdateList returns the updated List. Returns NOT_FOUND if the List
  // does not exist. THIS WILL OVERWRITE ALL EXISTING LIST.VALUES with the
  // new list values.
  rpc UpdateList(UpdateListRequest) returns (List);

  // Adds a value to a List and returns the updated List. Returns NOT_FOUND
  // if the List does not exist. Returns ALREADY_EXISTS if the value is
  // already in the List. Returns OUT_OF_RANGE if the List is at capacity.
  rpc AddListValue(AddListValueRequest) returns (List);

  // Removes a value from a List and returns the updated List. Returns
  // NOT_FOUND if the List or the value does not exist.
  rpc RemoveListValue(RemoveListValueRequest) returns (List);
}

// A representation of a Counter.
message Counter {
  // The name of the Counter.
  string name = 1;
  // The current count of the Counter.
  int64 count = 2;
  // The maximum capacity of the Counter.
  int64 capacity = 3;
}

// A representation of a Counter Update Request.
message CounterUpdateRequest {
  // The name of the Counter to update.
  string name = 1;
  // The value to set the Counter Count.
  optional int64 count = 2;
  // The value to set the Counter Capacity.
  optional int64 capacity = 3;
  // countDiff tracks if a Counter Update Request is CountIncrement (positive
  // integer), CountDecrement (negative integer), or neither (zero).
  int64 count_diff = 4;
}

message GetCounterRequest {
  // The name of the Counter to get.
  string name = 1;
}

message UpdateCounterRequest {
  // The requested update to make to the Counter.
  CounterUpdateRequest counter_update_request = 1;
}

// A representation of a List.
message List {
  // The name of the List.
  string name = 1;
  // The maximum capacity of the List.
  int64 capacity = 2;
  // The array of items in the List ["v1", "v2", …].
  repeated string values = 3;
}

message GetListRequest {
  // The name of the List to get.
  string name = 1;
}

message UpdateListRequest {
  // The List to update.
  List list = 1;
  // Required. Mask (list) of fields to update. Fields are specified
  // relative to the List (e.g. `capacity`, `values`).
  google.protobuf.FieldMask update_mask = 2;
}

message AddListValueRequest {
  // The name of the List to add a value to.
  string name = 1;
  // The value to add to the List.
  string value = 2;
}

message RemoveListValueRequest {
  // The name of the List to remove a value from.
  string name = 1;
  // The value to remove from the List.
  string value = 2;
}
