// Vendored wire-compatible subset of the Agones SDK proto
// (https://github.com/googleforgames/agones proto/sdk/sdk.proto, stable
// surface as of 1.4x). Message/field numbering matches Agones so official
// Agones client SDKs (Unity / Unreal / C# / C++ / Rust / Node) talk to the
// arena sidecar unmodified (DESIGN_v3 §6.1). grpc-gateway annotations are
// dropped; the sidecar serves REST on :9358 with hand-rolled routes.
syntax = "proto3";

package agones.dev.sdk;

option go_package = "github.com/moepig/arena/gen/agones/dev/sdk;sdk";

// SDK service to be used in the GameServer SDK to the Pod Sidecar.
service SDK {
  // Call when the GameServer is ready.
  rpc Ready(Empty) returns (Empty);

  // Call to self Allocation the GameServer.
  rpc Allocate(Empty) returns (Empty);

  // Call when the GameServer is shutting down.
  rpc Shutdown(Empty) returns (Empty);

  // Send a Empty every d Duration to declare that this GameSever is healthy.
  rpc Health(stream Empty) returns (Empty);

  // Retrieve the current GameServer data.
  rpc GetGameServer(Empty) returns (GameServer);

  // Send GameServer details whenever the GameServer is updated.
  rpc WatchGameServer(Empty) returns (stream GameServer);

  // Apply a Label to the backing GameServer metadata.
  rpc SetLabel(KeyValue) returns (Empty);

  // Apply a Annotation to the backing GameServer metadata.
  rpc SetAnnotation(KeyValue) returns (Empty);

  // Marks the GameServer as the Reserved state for Duration.
  rpc Reserve(Duration) returns (Empty);
}

// I am Empty.
message Empty {}

// Key, Value entry.
message KeyValue {
  string key = 1;
  string value = 2;
}

// time duration, in seconds.
message Duration {
  int64 seconds = 1;
}

// A GameServer Custom Resource Definition object. We will only export those
// resources that make the most sense. Can always expand to more as needed.
message GameServer {
  ObjectMeta object_meta = 1;
  Spec spec = 2;
  Status status = 3;

  // representation of the K8s ObjectMeta resource.
  message ObjectMeta {
    string name = 1;
    string namespace = 2;
    string uid = 3;
    string resource_version = 4;
    int64 generation = 5;
    // timestamp is in Epoch format, unit: seconds.
    int64 creation_timestamp = 6;
    // optional deletion timestamp in Epoch format, unit: seconds.
    int64 deletion_timestamp = 7;
    map<string, string> annotations = 8;
    map<string, string> labels = 9;
  }

  message Spec {
    Health health = 1;

    message Health {
      bool disabled = 1;
      int32 period_seconds = 2;
      int32 failure_threshold = 3;
      int32 initial_delay_seconds = 4;
    }
  }

  message Status {
    message Address {
      string type = 1;
      string address = 2;
    }

    message Port {
      string name = 1;
      int32 port = 2;
    }

    // [Stage:Alpha] PlayerStatus — not implemented by arena (Agones
    // recommends Counters/Lists); present for wire shape only.
    message PlayerStatus {
      int64 count = 1;
      int64 capacity = 2;
      repeated string ids = 3;
    }

    // [Stage:Beta] CounterStatus of a Counter.
    message CounterStatus {
      int64 count = 1;
      int64 capacity = 2;
    }

    // [Stage:Beta] ListStatus of a List.
    message ListStatus {
      int64 capacity = 1;
      repeated string values = 2;
    }

    string state = 1;
    string address = 2;
    repeated Port ports = 3;
    PlayerStatus players = 4;
    map<string, CounterStatus> counters = 5;
    map<string, ListStatus> lists = 6;
    repeated Address addresses = 7;
  }
}
